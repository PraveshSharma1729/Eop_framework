<Input>
  treelist selected extraCalibTree
  selection 'abs(chargeEle)==1' #EB/EE selection and splitting is performed within the code
  ietamin -85
  ietamax +85
  iphimin 1
  iphimax 360 
  eeringsFileName /afs/cern.ch/user/p/pravesh/private/Eop/CMSSW_14_0_22/src/Eop_framework/data/eerings.dat
#  inputIC IC /afs/cern.ch/user/f/fmonti/work/Eop_framework/output/PromptReco2017_103X_updatedSCregressionV3_forvalidation/IC_loop_14.root # the impact of running the MomentumCalibration on top of the computed ICs has to be studied
#  inputIC txtIC /afs/cern.ch/user/p/pravesh/private/EoP/CMSSW_14_0_13_patch2/src/Eop_framework/perXTal_ic_rereco2024CDE_v1_updated.dat

  <selected>
   filelist SELECTED_INPUTFILE
  </selected>

  <extraCalibTree>
   filelist EXTRACALIBTREE_INPUTFILE
 </extraCalibTree>
  
</Input>


<CalibrationMomentum>
# EE has far fewer Z legs than EB: lower nPhiBins if many fits fail
  nPhiBins 100
  rebin 10
# doEB 0 = fill only legs with 1.479<|etaSC|<2.5 (EE+ and EE- together)
  doEB 0
</CalibrationMomentum>

<Output>
  CalibrationMomentum_output CalibrationMomentumEE2016.root
</Output>  